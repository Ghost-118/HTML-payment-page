<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta charset="viewport" content="width=device-width, initial-sacle=1.0">
    <title>Checkout</title>
</head>

<body>

  <h1>Checkout</h1>

  <section>

  <h2>Your Cart</h2>

  <img
  src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
  alt="colorful cube product"
  width="200"
  >

  <h3>Colorful Cube</h3>
  <p>Quantity: 1</p>
  <p>Price: $19.99</p>

  </section> 

  <section>
    
  <h2>Payment  Information</h2>

  <form>
    <label for="card-name">
        Name  on Card
    <span aria-hidden="true">*</span>
    </label>

    <input
    type="text"
    id="card-name"
    name="card-name"
    required
    >

    <br><br>

    <label for="card-number">
        Card Number
    <span aria-hidden="true">*</span>
    </label>

    <input
    type="text"
    id="card-number"
    name="card-number"
    aria-describedby="card-number-help"
    required
    >

    <p id="card-number-help">
        Enter the 16-digit card number without spaces or hyphens.
    </p>

    <input type="submit" value="Complete Purchase">
  </form>
  </section>

</body> 

</html>
